<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoreo - Acceso</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1325; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #fff; }
        .card { background-color: #121c30; padding: 30px; border-radius: 12px; border: 1px solid #1e2c48; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #ffffff; }
        
        .nav-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #1e2c48; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #8a99ad; font-weight: bold; cursor: pointer; text-align: center; }
        .tab-btn.active { color: #10b981; border-bottom: 2px solid #10b981; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #8a99ad; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #1e2c48; background-color: #0b1325; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #10b981; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background-color: #10b981; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background-color: #059669; }

        .alert { padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; display: none; }
        .alert-error { background-color: #3b1820; border: 1px solid #7f1d1d; color: #f87171; }
        .alert-success { background-color: #064e3b; border: 1px solid #047857; color: #34d399; }
    </style>
</head>
<body>

<div class="card">
    <h2>Sistema de Monitoreo</h2>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="mostrarTab('loginTab')">Ingresar</button>
        <button class="tab-btn" onclick="mostrarTab('registroTab')">Registrarse</button>
    </div>

    <div id="alertBox" class="alert"></div>

    <!-- Formulario de Login -->
    <form id="loginForm">
        <div class="form-group">
            <label for="loginUser">Usuario</label>
            <input type="text" id="loginUser" required placeholder="Ingresa tu usuario">
        </div>
        <div class="form-group">
            <label for="loginPass">Contraseña</label>
            <input type="password" id="loginPass" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">Ingresar</button>
    </form>

    <!-- Formulario de Registro -->
    <form id="registroForm" style="display: none;">
        <div class="form-group">
            <label for="regUser">Nuevo Usuario</label>
            <input type="text" id="regUser" required placeholder="Crea un nombre de usuario">
        </div>
        <div class="form-group">
            <label for="regPass">Contraseña</label>
            <input type="password" id="regPass" required placeholder="••••••••">
        </div>
        <div class="form-group">
            <label for="regRol">Rol de Usuario</label>
            <select id="regRol">
                <option value="operador">Usuario Normal (Operador)</option>
                <option value="admin">Administrador</option>
            </select>
        </div>
        <button type="submit" class="btn">Crear Cuenta</button>
    </form>
</div>

<script>
    const alertBox = document.getElementById('alertBox');

    function mostrarMensaje(msg, esError = true) {
        alertBox.innerText = msg;
        alertBox.className = 'alert ' + (esError ? 'alert-error' : 'alert-success');
        alertBox.style.display = 'block';
    }

    function mostrarTab(tabName) {
        alertBox.style.display = 'none';
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        if(tabName === 'loginTab') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registroForm').style.display = 'none';
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registroForm').style.display = 'block';
        }
    }

    // Evento Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const usuario = document.getElementById('loginUser').value;
        const password = document.getElementById('loginPass').value;

        const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario, password })
        });
        const data = await res.json();

        if (data.success) {
            window.location.href = data.redirect;
        } else {
            mostrarMensaje(data.message, true);
        }
    });

    // Evento Registro
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const usuario = document.getElementById('regUser').value;
        const password = document.getElementById('regPass').value;
        const rol = document.getElementById('regRol').value;

        const res = await fetch('/registro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario, password, rol })
        });
        const data = await res.json();

        if (data.success) {
            mostrarMensaje('¡Cuenta creada! Ya puedes iniciar sesión', false);
            setTimeout(() => mostrarTab('loginTab'), 1500);
        } else {
            mostrarMensaje(data.message, true);
        }
    });
</script>

</body>
</html>
